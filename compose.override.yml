services:
  app-db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: fastapi_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d fastapi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-db-data:
